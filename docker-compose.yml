version: "3.9"

services:
  trufflehog-web:
    build: ./trufflehog-web
    container_name: trufflehog-web
    restart: unless-stopped
    networks:
      highfishNetwork:
        ipv4_address: 192.168.178.11
    volumes:
      - trufflehog-data:/app/data
    ports:
      - "5000:5000"
    environment:
      TZ: "Europe/Berlin"
      # Optional:
      # GITHUB_TOKEN: "dein-token"
      # GITLAB_TOKEN: "dein-token"

networks:
  highfishNetwork:
    external: true

volumes:
  trufflehog-data:
